name: nf-core AWS full size tests
# This workflow is triggered on PRs opened against the main/master branch.
# It can be additionally triggered manually with GitHub actions workflow dispatch button.
# It runs the -profile 'test_full' on AWS batch

on:
  workflow_dispatch:
  pull_request_review:
    types: [submitted]
  release:
    types: [published]

jobs:
  run-platform:
    name: Run AWS full tests
    # run only if the PR is approved by at least 2 reviewers and against the master/main branch or manually triggered
    if: github.repository == 'nf-core/airrflow' && github.event.review.state == 'approved' && (github.event.pull_request.base.ref == 'master' || github.event.pull_request.base.ref == 'main') || github.event_name == 'workflow_dispatch' || github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Set revision variable
        id: revision
        run: |
          echo "revision=${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'release') && github.sha || 'dev' }}" >> "$GITHUB_OUTPUT"

      - name: Launch workflow via Seqera Platform
        uses: seqeralabs/action-seqera-launch@v1.0.0-rc.2
        with:
          wait: none
          syntax-parser: v2
          workspace-id: ${{ vars.TOWER_WORKSPACE_ID }}
          access-token: ${{ secrets.TOWER_ACCESS_TOKEN }}
          compute-env: ${{ vars.TOWER_COMPUTE_ENV_NO_FUSION }}
          revision: ${{ steps.revision.outputs.revision }}
          work-dir: s3://${{ vars.AWS_S3_BUCKET }}/work/airrflow/work-${{ steps.revision.outputs.revision }}
          nextflow-config: |
            plugins {
              id 'nf-slack@0.5.0'
            }
            slack {
              enabled = true
              bot {
                token = '${{ secrets.NFSLACK_BOT_TOKEN }}'
                channel = 'airrflow'
              }
              onStart {
                enabled = false
              }
              onComplete {
                message = ':white_check_mark: *airrflow/test_full* completed successfully! :tada:'
              }
              onError {
                message = ':x: *airrflow/test_full* failed :crying_cat_face:'
              }
            }
          parameters: |
            {
              "outdir": "s3://${{ vars.AWS_S3_BUCKET }}/airrflow/results-${{ steps.revision.outputs.revision }}"
            }
          profiles: test_full
